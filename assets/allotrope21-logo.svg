<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Allotrope 21 Labs">
  <title>Allotrope 21 Labs</title>
  <!--
    Hexagonal rainbow mark: 6 triangular sectors around a central hexagonal hole.
    Each sector splits into two triangles for the woven-mosaic look.
    Colours cycle the visible spectrum (green -> cyan -> blue -> violet -> orange -> yellow)
    to echo the hyperspectral premise the studio names itself after.
  -->
  <defs>
    <!-- Six sector colors -->
    <linearGradient id="g-tl" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7BC142"/><stop offset="1" stop-color="#A7D34A"/>
    </linearGradient>
    <linearGradient id="g-tr" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2AB6D6"/><stop offset="1" stop-color="#4FD1FF"/>
    </linearGradient>
    <linearGradient id="g-r"  x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A6BD4"/><stop offset="1" stop-color="#5183F1"/>
    </linearGradient>
    <linearGradient id="g-br" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E39C9"/><stop offset="1" stop-color="#8B4CE0"/>
    </linearGradient>
    <linearGradient id="g-b"  x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E75B27"/><stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="g-bl" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3B826"/><stop offset="1" stop-color="#F9D24A"/>
    </linearGradient>
  </defs>

  <!--
    Hexagon geometry, flat-top oriented, cx=50 cy=50.
    Outer vertices O0..O5 at radius 42, inner vertices I0..I5 at radius 14
    for the central hexagonal hole. Midpoints M0..M5 at radius 42, halfway
    between outer vertices, give each sector its two-triangle woven look.
  -->

  <!-- ==== Sector 1 : top-left  (green) ==== -->
  <polygon points="14.60,29.00 50.00,8.00 32.30,18.50" fill="url(#g-tl)"/>
  <polygon points="14.60,29.00 32.30,18.50 32.30,39.75 22.30,45.5" fill="url(#g-tl)" opacity="0.92"/>

  <!-- ==== Sector 2 : top-right (cyan) ==== -->
  <polygon points="50.00,8.00 85.40,29.00 67.70,18.50" fill="url(#g-tr)"/>
  <polygon points="85.40,29.00 67.70,18.50 67.70,39.75 77.70,45.5" fill="url(#g-tr)" opacity="0.92"/>

  <!-- ==== Sector 3 : right (blue) ==== -->
  <polygon points="85.40,29.00 85.40,71.00 77.70,45.5" fill="url(#g-r)"/>
  <polygon points="85.40,71.00 77.70,45.5 67.70,60.25 77.70,54.5" fill="url(#g-r)" opacity="0.92"/>

  <!-- ==== Sector 4 : bottom-right (violet) ==== -->
  <polygon points="85.40,71.00 50.00,92.00 67.70,81.50" fill="url(#g-br)"/>
  <polygon points="85.40,71.00 67.70,81.50 67.70,60.25 77.70,54.5" fill="url(#g-br)" opacity="0.92"/>

  <!-- ==== Sector 5 : bottom (orange) ==== -->
  <polygon points="50.00,92.00 14.60,71.00 32.30,81.50" fill="url(#g-b)"/>
  <polygon points="50.00,92.00 32.30,81.50 67.70,81.50" fill="url(#g-b)" opacity="0.92"/>

  <!-- ==== Sector 6 : bottom-left (yellow) ==== -->
  <polygon points="14.60,71.00 14.60,29.00 22.30,54.5" fill="url(#g-bl)"/>
  <polygon points="14.60,71.00 22.30,54.5 32.30,60.25 32.30,81.50" fill="url(#g-bl)" opacity="0.92"/>

  <!-- Central hexagonal hole – shows through to the background -->
  <polygon points="50,32.4 65.15,41.2 65.15,58.8 50,67.6 34.85,58.8 34.85,41.2" fill="#0A0E1A"/>
</svg>
